  <style>
    :root { color-scheme: dark; --paper:#eee6d6; --muted:#b7ad9e; --accent:#d5a775; --line:#ffffff20; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; color:var(--paper); background:#161a1c; font-family:"Yu Mincho","Hiragino Mincho ProN",serif; line-height:1.9; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 85% 10%,#73573830,transparent 60%),linear-gradient(120deg,#1c2327,transparent); }
    button { font:inherit; }
    .layout { position:relative; max-width:1160px; margin:auto; padding:64px 36px; display:grid; grid-template-columns:240px 1fr; gap:72px; min-height:100vh; }
    aside { border-right:1px solid var(--line); padding-right:30px; }
    .eyebrow { color:var(--accent); font:12px/1.6 sans-serif; letter-spacing:.22em; }
    h1 { font-size:26px; font-weight:normal; line-height:1.7; margin:26px 0; }
    .intro { font-size:13px; color:var(--muted); }
    .chapters { padding:28px 0; list-style:none; font-size:13px; color:var(--muted); }
    .chapters li { padding:10px 0; }
    .chapters li.active { color:var(--accent); }
    .chapters span { display:inline-block; margin-right:12px; font:11px sans-serif; opacity:.6; }
    .endings { margin:0 0 20px; font-size:12px; color:var(--muted); }
    .endings span { display:block; padding-left:12px; }
    .restart { background:none; color:var(--muted); border:1px solid var(--line); padding:8px 14px; cursor:pointer; font-size:12px; }
    main { width:100%; max-width:700px; padding-top:4px; }
    .time { margin:0 0 16px; font-size:12px; color:var(--accent); letter-spacing:.12em; }
    h2 { margin:0 0 32px; font-size:25px; font-weight:normal; }
    h2:focus { outline:none; }
    #passage p { margin:0 0 20px; font-size:16px; }
    #passage p.dialogue { padding-left:18px; border-left:2px solid #d5a77544; }
    #passage p.letter { padding:4px 20px; border-left:1px solid var(--accent); }
    .choices { display:grid; gap:12px; margin-top:38px; }
    .choice { width:100%; display:flex; gap:18px; text-align:left; border:1px solid var(--line); color:var(--paper); background:#ffffff03; padding:16px 20px; cursor:pointer; transition:background .15s,border-color .15s; }
    .choice:hover { background:#d5a77510; border-color:var(--accent); }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .choice-number { color:var(--accent); font:12px/2.5 sans-serif; }
    .phrase { display:inline-block; }
    .note { color:var(--muted); font-size:12px; margin-top:28px; }
    .side-buttons { display:flex; flex-wrap:wrap; gap:10px; }
    .story-list { display:grid; gap:16px; }
    .story-card { width:100%; display:grid; gap:6px; text-align:left; border:1px solid var(--line); color:var(--paper); background:#ffffff03; padding:20px 22px; cursor:pointer; transition:background .15s,border-color .15s; }
    .story-card:hover { background:#d5a77510; border-color:var(--accent); }
    .story-card-title { font-size:19px; }
    .story-card-intro { font-size:14px; color:var(--muted); }
    .story-card-meta { font:12px/1.8 sans-serif; color:var(--accent); }
    .footer { margin-top:40px; border-top:1px solid var(--line); padding-top:18px; font-size:11px; color:var(--muted); }
    @media (max-width:760px) {
      .layout { display:block; padding:30px 22px; }
      aside { border-right:0; border-bottom:1px solid var(--line); padding:0 0 22px; margin-bottom:32px; }
      h1 { font-size:22px; margin:12px 0; }
      h1 br { display:none; }
      .intro { margin:8px 0; }
      .chapters { display:flex; flex-wrap:wrap; gap:18px; padding:4px 0; margin:8px 0; }
      .chapters li { padding:2px 0; }
      .endings { margin:8px 0 16px; }
      .endings span { display:inline-block; padding-left:10px; white-space:nowrap; }
      #passage p { font-size:17px; }
    }
    @media (prefers-reduced-motion:reduce) { .choice, .story-card { transition:none; } }
  </style>

<body>
  <div class="layout">
    <aside aria-label="作品と章">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="side-title"></h1>
      <p class="intro" id="side-intro"></p>
      <ol class="chapters" id="chapters"></ol>
      <p class="endings" id="endings"></p>
      <div class="side-buttons">
        <button class="restart" id="restart" type="button">最初から読む</button>
        <button class="restart" id="to-library" type="button">作品の一覧へ</button>
      </div>
    </aside>
    <main>
      <section id="library" hidden>
        <h2 id="library-title" tabindex="-1">収録作品</h2>
        <div id="story-list" class="story-list"></div>
      </section>
      <section id="reader">
        <p class="time" id="time"></p>
        <h2 id="scene-title" tabindex="-1"></h2>
        <div id="passage"></div>
        <div id="choices" class="choices" aria-label="次の言葉を選ぶ"></div>
        <p class="note" id="note"></p>
      </section>
      <div class="footer" id="footer"></div>
      <noscript>この作品を読むには、ブラウザーのJavaScriptを有効にしてください。</noscript>
    </main>
  </div>
  <script>
    'use strict';
    // tone は話ごとの最初の選び方。後の場面・手紙・結末の一文を切り替える（1本目では最初の聞き方）。
    let tone = '';
    // 読んでいる場所と読んだ結末はブラウザーに保存する。保存できない環境（プライベートブラウズなど）でも読めるよう、失敗は無視する。
    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }
    const renScenes = {
      opening: {
        chapter:0, time:'旅の終わり・前夜', title:'買っていない切符',
        paragraphs:[
          'レンの荷物は、驚くほど小さかった。三年の旅が、椅子の上の革袋に収まっている。',
          '窓の外で、駅の灯が一つ消えた。朝の列車は北へ行く。わたしが帰る家は、南にある。',
          '机には二通の封筒。一通は、わたしに届いた「今度こそ帰ってきて」という便り。もう一通は、レンの故郷から届いたものだった。そちらは封が切られていない。',
          '昼間、わたしはレンと言い合いになった。帰るのを迷うレンに強い言葉を投げ、レンは「一人で帰れる」とだけ返した。',
          '「切符、買ったのか」と、わたしは聞いた。',
          'レンは顔を上げずに答えた。「明日の朝でも買える」',
          'レンは袋の口を結び直した。結び目は、もう十分に固かった。',
          '戦いの前にも、レンは同じことをしていた。怖いと言う代わりに、荷物の結び目を確かめる。わたしは、それを指摘して喧嘩になったことがある。'
        ],
        choices:[
          {label:'「家からの手紙、読まないのか」', next:'ask', tone:'ask'},
          {label:'「また結び直してる。袋が気の毒だ」', next:'joke', tone:'joke'},
          {label:'「昼は、言い過ぎた」', next:'apology', tone:'apology'}
        ]
      },
      ask: {
        chapter:0, time:'旅の終わり・前夜', title:'封を切る前に',
        paragraphs:[
          'レンは封筒に目をやった。「読むと、帰る理由が変わる気がする」',
          '「どういう意味だ」と、わたしは聞いた。',
          '「謝れって書いてあったら、謝りに帰ることになる。帰ってこいって書いてあったら、呼ばれたから帰ることになる」',
          'わたしは聞き返した。「お前が帰りたいから、じゃ駄目なのか」',
          'レンは封筒を裏返した。差出人の名前を、手の下に隠すように。',
          '「帰りたい理由と、帰りたくない理由が、同じ人なんだよ」'
        ], choices:[{label:'答えを急がず、隣に座る', next:'request'}]
      },
      joke: {
        chapter:0, time:'旅の終わり・前夜', title:'いつもの調子',
        paragraphs:[
          'レンは袋を軽く叩いた。「途中で底が抜けたら、お前に持たせるからな」',
          '「毎回、わたしの荷物ばかり増える」と返した。',
          'レンが少し笑った。わたしも笑い、いつものように次の軽口を探した。',
          'それから、レンがぽつりと言った。「……こういう話なら、できるんだけどな」',
          'レンは結び目から手を離した。わたしは、用意していた軽口を飲み込んだ。'
        ], choices:[{label:'「ほかの話も、していい」', next:'request'}]
      },
      apology: {
        chapter:0, time:'旅の終わり・前夜', title:'言い過ぎたこと',
        paragraphs:[
          '昼、わたしは言った。「帰ると言ったなら帰れ。何を今さら迷ってる」',
          '「間違ってはいなかった」レンが答えた。',
          '「間違ってなければ、何を言ってもいいわけじゃないだろ」と、わたしは返した。',
          'レンが小さく笑った。「それ、昔、俺がお前に言ったな」',
          '吊り橋の前だった。わたしは怖くて渡れず、レンは苛立っていた。結局、レンは先に渡り、反対側でずっと待っていた。',
          '「覚えてる」と、わたしは言った。',
          '「俺も」とレンは言った。「待たされたことより、自分の怒った顔のほうを覚えてる」'
        ], choices:[{label:'レンが続けるのを待つ', next:'request'}]
      },
      request: {
        chapter:1, time:'夜更け', title:'門の前まで',
        paragraphs:[
          'しばらく黙ってから、レンが言った。「故郷まで来てくれ。門の前まででいい」',
          '「一人で帰れるって、昼には言ってた」と、わたしは返した。',
          '「帰れるよ」',
          '「じゃあ、何でわたしが必要なんだ」',
          'レンは結び目に目を落とした。「お前がいたら、引き返そうとしたときに喧嘩になるだろ」',
          '「わたしに止めさせるのか」',
          '「……頼み方まで、お前と同じにはできない」と、レンは言った。',
          'わたしは机の便りを見る。南へ帰ると、返事を出した。明日の夕方には着くと書いた。レンの故郷に寄れば、少なくとも四日は遅れる。',
          '「断るなら、断ってくれ」レンが言う。「黙ってる間、お前が何を考えてるのか、俺には分からない」'
        ],
        choices:[
          {label:'「門までだ。その先はお前が話せ」', next:'accompany'},
          {label:'「明日は帰る。でも、今夜なら聞ける」', next:'listen'},
          {label:'「帰りたくないなら、わたしを理由にするな」', next:'confront'}
        ]
      },
      accompany: {
        chapter:1, time:'夜明け前', title:'北へ行く二枚',
        paragraphs:() => [
          '「門までだ。その先はお前が話せ」',
          'レンは、すぐには礼を言わなかった。',
          '「お前、帰るんだろ」',
          '「便りを書く。遅れるって」と、わたしは答えた。',
          '「書けば済むのか」とレンが言う。',
          '「済まない。でも行く」',
          tone === 'apology' ? '「昼の埋め合わせなら、やめろよ」とレンが言った。「違う」わたしは答えた。違う、と言い切れるかは分からなかった。' : 'レンはわたしの便りに目を落とした。「俺のせいにするなよ」「しない」その約束も、守らなければならなくなった。',
          '駅に着くと、レンは北行きの切符を二枚買った。わたしの分を差し出す手は、いつものように乱暴だった。'
        ], choices:[{label:'三週間後の手紙を読む', next:'letter_accompany'}]
      },
      listen: {
        chapter:1, time:'夜明け前', title:'付き添えない夜',
        paragraphs:() => [
          '「明日は帰る。でも、今夜なら聞ける」',
          'レンは首を振った。「今夜だけで、どうにかなる話じゃない」',
          '「どうにかできるとは言ってない」と、わたしは言った。',
          'レンは椅子を引いた。わたしから、少し離れた場所に。',
          '「弟が店を継いだ。俺が投げ出した店だ。帰ったら、まず何て言えばいい」',
          tone === 'ask' ? '「手紙には、書いてあるかもしれない」とわたしが言うと、レンは「だから、まだ読めないんだよ」と返した。今度は、わたしも封筒を裏返したままにした。' : 'わたしは答えを探した。何度も敵の弱点を言い当てた口から、今夜は何も出てこなかった。',
          '「分からない」と答えると、レンは「だろうな」と言った。それから、弟の話をした。わたしが知らなかった、旅に出る前の話を。',
          '朝、駅で別れた。「話したからって、帰れるとは限らないぞ」とレンが言い、わたしは「分かった」と答えた。レンは、わたしの南行きの切符を一度だけ見た。'
        ], choices:[{label:'三週間後の手紙を読む', next:'letter_listen'}]
      },
      confront: {
        chapter:1, time:'夜明け前', title:'置いていく言葉',
        paragraphs:() => [
          '「帰りたくないなら、わたしを理由にするな」',
          'レンの手が止まった。',
          '「一緒に来てほしいと言ったんだ。帰りたくないとは言ってない」',
          'わたしは言い返そうとして、やめた。',
          tone === 'joke' ? 'さっき笑ったことまで、取り消された気がした。レンは袋を持ち上げた。「こういう話は、やっぱり難しいな」' : '「頼んだのは俺だ。断るのはお前だ。それで済む話だったろ」レンは封筒を袋にしまった。',
          'しばらくして、わたしは言った。「……今のは、決めつけた」',
          '「そうだな」とだけ、レンは答えた。',
          '謝れば話を続けられると思っていた。レンはもう袋を背負っていた。',
          '扉の前で、レンが振り向いた。「帰るかどうかは、自分で決める。お前もちゃんと帰れよ」'
        ], choices:[{label:'三週間後の手紙を読む', next:'letter_confront'}]
      },
      letter_accompany: {
        chapter:2, time:'三週間後・わたしの家', title:'門の向こう',
        letter:true,
        paragraphs:[
          'あの門の前で、帰れと言ったのは俺だ。お前がずっと立っていたら、弟より先にお前の顔を見てしまいそうだった。',
          '店には入った。謝ろうとしたら、弟に「まず荷物をどけてくれ」と言われた。客がいた。',
          '今は朝だけ手伝っている。昔と置き場所が違って、何をするにも弟に聞く。まだ、あの話はできていない。',
          'お前は帰れたか。四日、遅れたんだろ。',
          '付き添ってくれたことは嬉しかった。あのとき言わなかったので、書いておく。',
          'レン'
        ], choices:[{label:'手紙を置く', next:'ending_accompany'}]
      },
      letter_listen: {
        chapter:2, time:'三週間後・わたしの家', title:'宛先のある手紙',
        letter:true,
        paragraphs:() => [
          '北の列車には乗った。家までは行かなかった。隣町で降りた。',
          '弟に手紙を書いたら、返事が来た。「会いたいなら来ればいい」とだけ。怒っているのかどうか、字では分からない。',
          'まだ隣町にいる。仕事を見つけた。毎朝、北へ行く列車が通る。',
          tone === 'ask' ? 'あの夜の手紙も読んだ。お前の前で開けなかったのは、読んだ顔を見られたくなかったからだと思う。' : 'あの夜、弟の話をしたのは久しぶりだった。話している間は、会えるような気がしていた。',
          '家の話は、また今度書く。お前の家はどうだ。',
          'レン'
        ], choices:[{label:'手紙を置く', next:'ending_listen'}]
      },
      letter_confront: {
        chapter:2, time:'三週間後・わたしの家', title:'近況',
        letter:true,
        paragraphs:() => [
          '北へ帰った。店に弟がいた。髪が短くなっていた。',
          'しばらくここにいることにした。部屋は空いていた。物置になっていたので、片づけから始めている。',
          'あの晩は腹が立った。今も思い出すと腹が立つ。帰れたから、あれでよかった、とは思わない。',
          tone === 'apology' ? '昼のことを謝ったのは、聞いていた。それと、夜の話は別だ。' : 'ただ、お前に手紙を書くつもりではいた。住所は、旅の途中で聞いていた。',
          '昔、お前に借りた砥石が袋から出てきた。返すので、都合のいい頃を書いてくれ。',
          'レン'
        ], choices:[{label:'手紙を置く', next:'ending_confront'}]
      },
      ending_accompany: {
        chapter:2, time:'読了', title:'帰ってからのこと',
        paragraphs:() => [
          '家に帰った日、待っていた人は「おかえり」と言った。食卓には、わたしの席も用意されていた。',
          '遅れた理由を話すと、「分かった」と答えた。それから、わたしが帰るはずだった日に何をしていたか、少しずつ話した。',
          'わたしはその話を、途中で止めずに聞いた。',
          {
            ask:'あの夜、レンが封筒を裏返した手つきを思い出した。話が終わるまで、わたしも膝の上の手を動かさなかった。',
            joke:'途中で一度、いつものように軽口を挟みかけた。あの夜のレンの顔が浮かんで、わたしは口を閉じた。',
            apology:'「遅れてすまない」と言うと、「埋め合わせはいらない」と返ってきた。どこかで聞いた言い方だと思った。'
          }[tone],
          'レンへの返事には、無事に帰った、と書いた。四日間のことは、まだ書いていない。'
        ], choices:[{label:'2章「門の前まで」から選び直す', next:'request'}, {label:'最初から読む', next:'opening', reset:true}], end:true
      },
      ending_listen: {
        chapter:2, time:'読了', title:'空けておく一行',
        paragraphs:() => [
          '返事に、迎えに行こうか、と書いた。しばらく眺めてから、その一行を消した。',
          '今なら行ける。けれど、あの夜には行けなかった。その違いを、レンにどう伝えればいいのか分からない。',
          '代わりに、帰り道で見た景色を書いた。あの夜に聞いた弟の話も、一つ書き添えた。',
          {
            ask:'家からの手紙を読んだことにも、一言だけ触れた。何が書いてあったかは、聞かなかった。',
            joke:'最後に、いつもの軽口を一つ書きかけて、やめた。消した行は、それで二つになった。',
            apology:'あの日の昼のことを、もう一度謝ろうかと考えた。それより先に聞くことがある気がして、書かなかった。'
          }[tone],
          '紙には、まだ何行か余白があった。'
        ], choices:[{label:'2章「門の前まで」から選び直す', next:'request'}, {label:'最初から読む', next:'opening', reset:true}], end:true
      },
      ending_confront: {
        chapter:2, time:'読了', title:'返してほしいもの',
        paragraphs:() => [
          '砥石は、もう要らなかった。家には新しいものがある。',
          '要らない、と書けば、レンは送り返すのをやめるだろう。都合のいい日を書けば、顔を合わせることになるかもしれない。',
          'わたしは日付を書いた。その下に、あの晩のことを謝る一文を足した。',
          {
            ask:'封を切らずにいたレンを思い出した。わたしはレンの手紙を、届いた日のうちに三度読んでいた。',
            joke:'謝る一文は、少し硬い言い方になった。崩して書くと、冗談に読まれる気がした。',
            apology:'謝るのは、これで三度目になる。昼の話と夜の話は別だと、レンは書いてきた。だから今度は、夜のことだけを書いた。'

          label.append(piece);

      });
      showStoryParts(true);
      $('footer').textContent = `読了目安：約${s.minutes}分 ／ ${SAVE_NOTE}`;
      document.title = stories.length < 2 ? titleOf(s) : `${titleOf(s)} ｜ ${titleOf(COLLECTION)}`;
      const progress = loadProgress(s);
      tone = progress ? progress.tone : '';
      render(progress ? progress.scene : s.start, moveFocus);
      // 結末では「ありがとうございました」の文を残す（続きからの知らせで上書きしない）。
      if (progress && !s.scenes[progress.scene].end) $('note').textContent = '前回の続きから表示しています。「最初から読む」で始めからに戻れます。';
    }
    function showLibrary(moveFocus = true) {
      story = null;
      $('eyebrow').textContent = 'SHORT STORIES';
      setLines($('side-title'), COLLECTION.titleLines);
      setLines($('side-intro'), COLLECTION.introLines);
      showStoryParts(false);
      $('footer').textContent = SAVE_NOTE;
      document.title = titleOf(COLLECTION);
      const list = $('story-list');
      list.replaceChildren();
      for (const s of stories) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'story-card';
        const meta = [`約${s.minutes}分`, `読んだ結末 ${loadEndings(s).length} / ${endingIds(s).length}`];
        if (loadProgress(s)) meta.push('続きから');
        for (const [className, text] of [['story-card-title', titleOf(s)], ['story-card-intro', s.introLines.join('')], ['story-card-meta', meta.join(' ／ ')]]) {
          const part = document.createElement('span');
          part.className = className;
          part.textContent = text;
          card.append(part);
        }
        card.addEventListener('click', () => {
          history.pushState(null, '', `#${s.id}`);
          openStory(s);
        });
        list.append(card);
      }
      if (moveFocus) {
        $('library-title').focus({preventScroll:true});
        scrollTo({top:0, behavior:'instant'});
      }
    }
    // URL の末尾（#ren など）で話を指せる。話が1本のうちは何が付いていても1本目を開く。
    function route(moveFocus) {
      const target = stories.length < 2 ? stories[0] : stories.find(s => location.hash === `#${s.id}`);
      if (target) openStory(target, moveFocus);
      else showLibrary(moveFocus);
    }
    $('restart').addEventListener('click', () => {
      tone = '';
      render(story.start);
    });
    $('to-library').addEventListener('click', () => {
      history.pushState(null, '', location.pathname + location.search);
      showLibrary();
    });
    addEventListener('popstate', () => route(true));
    route(false);
  </script>
</body>
</html>
