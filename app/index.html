  <style>

    .choice:hover { background:#d5a77510; border-color:var(--accent); }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .choice-number { color:var(--accent); font:12px/2.5 sans-serif; }
    .note { color:var(--muted); font-size:12px; margin-top:28px; }
    .footer { margin-top:40px; border-top:1px solid var(--line); padding-top:18px; font-size:11px; color:var(--muted); }
    @media (max-width:760px) {

      h1 br { display:none; }
      .intro { margin:8px 0; }
      .chapters { display:flex; flex-wrap:wrap; gap:18px; padding:4px 0; margin:8px 0; }

<body>
  <div class="layout">
    <aside aria-label="作品と章">
      <div class="eyebrow">SHORT STORY</div>
      <h1>別れの続きを<br>知らない</h1>
      <p class="intro">旅を終えた二人の、一夜の会話。<br>あなたは、帰りを待つ人のいる旅人。</p>
      <ol class="chapters">
        <li id="chapter-0" class="active"><span>01</span>出発前夜</li>
        <li id="chapter-1"><span>02</span>別れの言葉</li>
        <li id="chapter-2"><span>03</span>その後の手紙</li>
      </ol>
      <p class="endings" id="endings"></p>
      <button class="restart" id="restart" type="button">最初から読む</button>
    </aside>
    <main>
      <p class="time" id="time"></p>
      <h2 id="scene-title" tabindex="-1"></h2>
      <div id="passage"></div>
      <div id="choices" class="choices" aria-label="次の言葉を選ぶ"></div>
      <p class="note" id="note"></p>
      <div class="footer">読了目安：約5分 ／ 読んでいる場所と読んだ結末は、このブラウザーに保存されます</div>
      <noscript>この作品を読むには、ブラウザーのJavaScriptを有効にしてください。</noscript>
    </main>
  </div>
  <script>
    'use strict';
    // tone は最初の聞き方。後の場面・手紙・結末の一文を切り替える。
    let tone = '';
    // 読んでいる場所と読んだ結末はブラウザーに保存する。保存できない環境（プライベートブラウズなど）でも読めるよう、失敗は無視する。
    const PROGRESS_KEY = 'wakare-progress';
    const ENDINGS_KEY = 'wakare-endings';
    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }
    let readEndings = load(ENDINGS_KEY, []);
    const scenes = {
      opening: {
        chapter:0, time:'旅の終わり・前夜', title:'買っていない切符',
        paragraphs:[
          'レンの荷物は、驚くほど小さかった。三年の旅が、椅子の上の革袋に収まっている。',
          '窓の外で、駅の灯が一つ消えた。朝の列車は北へ行く。あなたが帰る家は、南にある。',
          '机には二通の封筒。一通は、あなたに届いた「今度こそ帰ってきて」という便り。もう一通は、レンの故郷から届いたものだった。そちらは封が切られていない。',
          '昼間、あなたはレンと言い合いになった。帰るのを迷うレンに強い言葉を投げ、レンは「一人で帰れる」とだけ返した。',
          '「切符、買ったのか」と、あなたは聞いた。',
          '「明日の朝でも買える」',
          'レンは袋の口を結び直した。結び目は、もう十分に固かった。',
          '戦いの前にも、レンは同じことをしていた。怖いと言う代わりに、荷物の結び目を確かめる。あなたは、それを指摘して喧嘩になったことがある。'
        ],
        choices:[
          {label:'「家からの手紙、読まないのか」', next:'ask', tone:'ask'},
          {label:'「また結び直してる。袋が気の毒だ」', next:'joke', tone:'joke'},
          {label:'「昼は、言い過ぎた」', next:'apology', tone:'apology'}
        ]
      },
      ask: {
        chapter:0, time:'旅の終わり・前夜', title:'封を切る前に',
        paragraphs:[
          '「読むと、帰る理由が変わる気がする」',
          '「どういう意味だ」',
          '「謝れって書いてあったら、謝りに帰ることになる。帰ってこいって書いてあったら、呼ばれたから帰ることになる」',
          '「お前が帰りたいから、じゃ駄目なのか」',
          'レンは封筒を裏返した。差出人の名前を、手の下に隠すように。',
          '「帰りたい理由と、帰りたくない理由が、同じ人なんだよ」'
        ], choices:[{label:'答えを急がず、隣に座る', next:'request'}]
      },
      joke: {
        chapter:0, time:'旅の終わり・前夜', title:'いつもの調子',
        paragraphs:[
          '「途中で底が抜けたら、お前に持たせるからな」',
          '「毎回、俺の荷物ばかり増える」と、あなたは返した。',
          'レンが少し笑った。あなたも笑い、いつものように次の軽口を探した。',
          '「……こういう話なら、できるんだけどな」',
          'レンは結び目から手を離した。あなたは、用意していた軽口を飲み込んだ。'
        ], choices:[{label:'「ほかの話も、していい」', next:'request'}]
      },
      apology: {
        chapter:0, time:'旅の終わり・前夜', title:'言い過ぎたこと',
        paragraphs:[
          '昼、あなたは言った。「帰ると言ったなら帰れ。何を今さら迷ってる」',
          '「間違ってはいなかった」レンが答えた。',
          '「間違ってなければ、何を言ってもいいわけじゃないだろ」',
          '「それ、昔、俺がお前に言ったな」',
          '吊り橋の前だった。あなたは怖くて渡れず、レンは苛立っていた。結局、レンは先に渡り、反対側でずっと待っていた。',
          '「覚えてる」と、あなたは言った。',
          '「俺も。待たせたことより、怒った顔のほうを覚えてる」'
        ], choices:[{label:'レンが続けるのを待つ', next:'request'}]
      },
      request: {
        chapter:1, time:'夜更け', title:'門の前まで',
        paragraphs:[
          '「故郷まで来てくれ。門の前まででいい」',
          '「一人で帰れるって、昼には言ってた」',
          '「帰れるよ」',
          '「じゃあ、何で俺が必要なんだ」',
          '「お前がいたら、引き返そうとしたときに喧嘩になるだろ」',
          '「俺に止めさせるのか」',
          '「……頼み方まで、お前と同じにはできない」',
          'あなたは机の便りを見る。南へ帰ると、返事を出した。明日の夕方には着くと書いた。レンの故郷に寄れば、少なくとも四日は遅れる。',
          '「断るなら、断ってくれ」レンが言う。「黙ってる間、お前が何を考えてるのか、俺には分からない」'
        ],
        choices:[
          {label:'「門までだ。その先はお前が話せ」', next:'accompany'},
          {label:'「明日は帰る。でも、今夜なら聞ける」', next:'listen'},
          {label:'「帰りたくないなら、俺を理由にするな」', next:'confront'}
        ]
      },
      accompany: {
        chapter:1, time:'夜明け前', title:'北へ行く二枚',
        paragraphs:() => [
          '「門までだ。その先はお前が話せ」',
          'レンは、すぐには礼を言わなかった。',
          '「お前、帰るんだろ」',
          '「便りを書く。遅れるって」',
          '「書けば済むのか」',
          '「済まない。でも行く」',
          tone === 'apology' ? '「昼の埋め合わせなら、やめろよ」「違う」あなたは答えた。違う、と言い切れるかは分からなかった。' : 'レンはあなたの便りに目を落とした。「俺のせいにするなよ」「しない」その約束も、守らなければならなくなった。',
          '駅に着くと、レンは北行きの切符を二枚買った。あなたの分を差し出す手は、いつものように乱暴だった。'
        ], choices:[{label:'三週間後の手紙を読む', next:'letter_accompany'}]
      },
      listen: {
        chapter:1, time:'夜明け前', title:'付き添えない夜',
        paragraphs:() => [
          '「明日は帰る。でも、今夜なら聞ける」',
          '「今夜だけで、どうにかなる話じゃない」',
          '「どうにかできるとは言ってない」',
          'レンは椅子を引いた。あなたから、少し離れた場所に。',
          '「弟が店を継いだ。俺が投げ出した店だ。帰ったら、まず何て言えばいい」',
          tone === 'ask' ? '「手紙には、書いてあるかもしれない」「だから、まだ読めないんだよ」今度は、あなたも封筒を裏返したままにした。' : 'あなたは答えを探した。何度も敵の弱点を言い当てた口から、今夜は何も出てこなかった。',
          '「分からない」と答えると、レンは「だろうな」と言った。それから、弟の話をした。あなたが知らなかった、旅に出る前の話を。',
          '朝、駅で別れた。「話したからって、帰れるとは限らないぞ」とレンが言い、あなたは「分かった」と答えた。レンは、あなたの南行きの切符を一度だけ見た。'
        ], choices:[{label:'三週間後の手紙を読む', next:'letter_listen'}]
      },
      confront: {
        chapter:1, time:'夜明け前', title:'置いていく言葉',
        paragraphs:() => [
          '「帰りたくないなら、俺を理由にするな」',
          'レンの手が止まった。',
          '「一緒に来てほしいと言ったんだ。帰りたくないとは言ってない」',
          'あなたは言い返そうとして、やめた。',
          tone === 'joke' ? 'さっき笑ったことまで、取り消された気がした。レンは袋を持ち上げた。「こういう話は、やっぱり難しいな」' : '「頼んだのは俺だ。断るのはお前だ。それで済む話だったろ」レンは封筒を袋にしまった。',
          '「……今のは、決めつけた」',
          '「そうだな」',
          '謝れば話を続けられると思っていた。レンはもう袋を背負っていた。',
          '扉の前で、レンが振り向いた。「帰るかどうかは、自分で決める。お前もちゃんと帰れよ」'
        ], choices:[{label:'三週間後の手紙を読む', next:'letter_confront'}]
      },
      letter_accompany: {
        chapter:2, time:'三週間後・あなたの家', title:'門の向こう',
        letter:true,
        paragraphs:[
          'あの門の前で、帰れと言ったのは俺だ。お前がずっと立っていたら、弟より先にお前の顔を見てしまいそうだった。',
          '店には入った。謝ろうとしたら、弟に「まず荷物をどけてくれ」と言われた。客がいた。',
          '今は朝だけ手伝っている。昔と置き場所が違って、何をするにも弟に聞く。まだ、あの話はできていない。',
          'お前は帰れたか。四日、遅れたんだろ。',
          '付き添ってくれたことは嬉しかった。あのとき言わなかったので、書いておく。',
          'レン'
        ], choices:[{label:'手紙を置く', next:'ending_accompany'}]
      },
      letter_listen: {
        chapter:2, time:'三週間後・あなたの家', title:'宛先のある手紙',
        letter:true,
        paragraphs:() => [
          '北の列車には乗った。家までは行かなかった。隣町で降りた。',
          '弟に手紙を書いたら、返事が来た。「会いたいなら来ればいい」とだけ。怒っているのかどうか、字では分からない。',
          'まだ隣町にいる。仕事を見つけた。毎朝、北へ行く列車が通る。',
          tone === 'ask' ? 'あの夜の手紙も読んだ。お前の前で開けなかったのは、読んだ顔を見られたくなかったからだと思う。' : 'あの夜、弟の話をしたのは久しぶりだった。話している間は、会えるような気がしていた。',
          '家の話は、また今度書く。お前の家はどうだ。',
          'レン'
        ], choices:[{label:'手紙を置く', next:'ending_listen'}]
      },
      letter_confront: {
        chapter:2, time:'三週間後・あなたの家', title:'近況',
        letter:true,
        paragraphs:() => [
          '北へ帰った。店に弟がいた。髪が短くなっていた。',
          'しばらくここにいることにした。部屋は空いていた。物置になっていたので、片づけから始めている。',
          'あの晩は腹が立った。今も思い出すと腹が立つ。帰れたから、あれでよかった、とは思わない。',
          tone === 'apology' ? '昼のことを謝ったのは、聞いていた。それと、夜の話は別だ。' : 'ただ、お前に手紙を書くつもりではいた。住所は、旅の途中で聞いていた。',
          '昔、お前に借りた砥石が袋から出てきた。返すので、都合のいい頃を書いてくれ。',
          'レン'
        ], choices:[{label:'手紙を置く', next:'ending_confront'}]
      },
      ending_accompany: {
        chapter:2, time:'読了', title:'帰ってからのこと',
        paragraphs:() => [
          '家に帰った日、待っていた人は「おかえり」と言った。食卓には、あなたの席も用意されていた。',
          '遅れた理由を話すと、「分かった」と答えた。それから、あなたが帰るはずだった日に何をしていたか、少しずつ話した。',
          'あなたはその話を、途中で止めずに聞いた。',
          {
            ask:'あの夜、レンが封筒を裏返した手つきを思い出した。話が終わるまで、あなたも膝の上の手を動かさなかった。',
            joke:'途中で一度、いつものように軽口を挟みかけた。あの夜のレンの顔が浮かんで、あなたは口を閉じた。',
            apology:'「遅れてすまない」と言うと、「埋め合わせはいらない」と返ってきた。どこかで聞いた言い方だと思った。'
          }[tone],
          'レンへの返事には、無事に帰った、と書いた。四日間のことは、まだ書いていない。'
        ], choices:[{label:'2章「門の前まで」から選び直す', next:'request'}, {label:'最初から読む', next:'opening', reset:true}], end:true
      },
      ending_listen: {
        chapter:2, time:'読了', title:'空けておく一行',
        paragraphs:() => [
          '返事に、迎えに行こうか、と書いた。しばらく眺めてから、その一行を消した。',
          '今なら行ける。けれど、あの夜には行けなかった。その違いを、レンにどう伝えればいいのか分からない。',
          '代わりに、帰り道で見た景色を書いた。あの夜に聞いた弟の話も、一つ書き添えた。',
          {
            ask:'家からの手紙を読んだことにも、一言だけ触れた。何が書いてあったかは、聞かなかった。',
            joke:'最後に、いつもの軽口を一つ書きかけて、やめた。消した行は、それで二つになった。',
            apology:'あの日の昼のことを、もう一度謝ろうかと考えた。それより先に聞くことがある気がして、書かなかった。'
          }[tone],
          '紙には、まだ何行か余白があった。'
        ], choices:[{label:'2章「門の前まで」から選び直す', next:'request'}, {label:'最初から読む', next:'opening', reset:true}], end:true
      },
      ending_confront: {
        chapter:2, time:'読了', title:'返してほしいもの',
        paragraphs:() => [
          '砥石は、もう要らなかった。家には新しいものがある。',
          '要らない、と書けば、レンは送り返すのをやめるだろう。都合のいい日を書けば、顔を合わせることになるかもしれない。',
          'あなたは日付を書いた。その下に、あの晩のことを謝る一文を足した。',
          {
            ask:'封を切らずにいたレンを思い出した。あなたはレンの手紙を、届いた日のうちに三度読んでいた。',
            joke:'謝る一文は、少し硬い言い方になった。崩して書くと、冗談に読まれる気がした。',
            apology:'謝るのは、これで二度目になる。昼の話と夜の話は別だと、レンは書いてきた。だから今度は、夜のことだけを書いた。'
          }[tone],
          '返事が来るまでは、手紙を読んだときのレンの顔を、何度も想像するのだと思った。'
        ], choices:[{label:'2章「門の前まで」から選び直す', next:'request'}, {label:'最初から読む', next:'opening', reset:true}], end:true
      }
    };

    function render(sceneId, moveFocus = true) {
      const scene = scenes[sceneId];
      const title = document.getElementById('scene-title');
      document.getElementById('time').textContent = scene.time;
      title.textContent = scene.title;
      const passage = document.getElementById('passage');
      passage.replaceChildren();
      const paragraphs = typeof scene.paragraphs === 'function' ? scene.paragraphs() : scene.paragraphs;
      for (const text of paragraphs.filter(Boolean)) {
        const paragraph = document.createElement('p');
        paragraph.textContent = text;
        if (scene.letter) paragraph.className = 'letter';
        else if (text.startsWith('「')) paragraph.className = 'dialogue';
        passage.append(paragraph);
      }
      const choices = document.getElementById('choices');
      choices.replaceChildren();
      scene.choices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        const number = document.createElement('span');
        number.className = 'choice-number';
        number.setAttribute('aria-hidden', 'true');
        number.textContent = String(index + 1).padStart(2, '0');
        const label = document.createElement('span');
        label.textContent = choice.label;
        button.append(number, label);
        button.addEventListener('click', () => {
          if (choice.reset) tone = '';
          if (choice.tone) tone = choice.tone;
          render(choice.next);
        });
        choices.append(button);
      });
      for (let index = 0; index < 3; index++) {
        const chapter = document.getElementById(`chapter-${index}`);
        chapter.classList.toggle('active', index === scene.chapter);
        if (index === scene.chapter) chapter.setAttribute('aria-current', 'step');
        else chapter.removeAttribute('aria-current');
      }
      if (scene.end && !readEndings.includes(sceneId)) {
        readEndings.push(sceneId);
        save(ENDINGS_KEY, readEndings);
      }
      save(PROGRESS_KEY, {scene:sceneId, tone});
      renderEndings();
      document.getElementById('note').textContent = scene.end
        ? (readEndings.length < ENDING_IDS.length
          ? 'お読みいただき、ありがとうございました。別の言葉を選び直すと、違う結末を読めます。'
          : 'お読みいただき、ありがとうございました。三つの結末をすべて読みました。')
        : scene.letter ? 'これは、レンがあなたに伝えることを選んだ手紙です。' : '選択肢を選ぶと進みます。';
      // 場面が変わったら、本文と選択肢をふわっと出す。動きを減らす設定の端末では出さない。
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (const element of [document.getElementById('time'), title, passage, choices]) {
          element.animate([{opacity:0}, {opacity:1}], {duration:500, easing:'ease-out'});
        }
      }
      if (moveFocus) {
        title.focus({preventScroll:true});
        title.scrollIntoView({block:'start', behavior:'instant'});
      }
    }
    const ENDING_IDS = Object.keys(scenes).filter(id => scenes[id].end);
    const TONES = ['ask', 'joke', 'apology'];
    // 保存データが壊れている・古い場面名が残っているときに止まらないよう、今ある結末だけを重複なしで数える。
    readEndings = Array.isArray(readEndings) ? [...new Set(readEndings.filter(id => ENDING_IDS.includes(id)))] : [];
    // 読んだ結末は題名を見せ、まだの結末は伏せる。
    function renderEndings() {
      const box = document.getElementById('endings');
      box.replaceChildren(`読んだ結末　${readEndings.length} / ${ENDING_IDS.length}`);
      for (const id of ENDING_IDS) {
        const line = document.createElement('span');
        line.textContent = readEndings.includes(id) ? `・${scenes[id].title}` : '・？？？';
        box.append(line);
      }
    }
    document.getElementById('restart').addEventListener('click', () => {
      tone = '';
      render('opening');
    });
    const progress = load(PROGRESS_KEY, null);
    // 続きから開くのは、場面名と最初の選び方の両方が今の作品に合うときだけ。合わなければ最初から。
    if (progress && typeof progress.scene === 'string' && Object.hasOwn(scenes, progress.scene)
        && progress.scene !== 'opening' && TONES.includes(progress.tone)) {
      tone = progress.tone;
      render(progress.scene, false);
      document.getElementById('note').textContent = '前回の続きから表示しています。「最初から読む」で始めからに戻れます。';
    } else {
      render('opening', false);
    }
  </script>
</body>
</html>
